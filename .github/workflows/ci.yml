name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --lib -- --test-threads=4
      - name: Verify snapshot baselines
        run: cargo test --lib snap_ -- --test-threads=4

  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run conformance tests
        run: cargo test --test conformance -- --test-threads=4
      - name: Run schema validation
        run: cargo test --test schema_validation -- --test-threads=4

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Robot command matrix
        env:
          BVR_E2E_ARTIFACT_DIR: target/bvr-e2e-artifacts
        run: cargo test --test e2e_robot_matrix -- --test-threads=4
      - name: Robot alert tests
        run: cargo test --test robot_alerts -- --test-threads=4
      - name: Robot burndown scope
        run: cargo test --test robot_burndown_scope -- --test-threads=4
      - name: Robot history since
        run: cargo test --test robot_history_since -- --test-threads=4
      - name: Export tests
        run: cargo test --test export_md --test export_pages -- --test-threads=4
      - name: Admin CLI tests
        run: cargo test --test admin_cli -- --test-threads=4
      - name: CLI model validation
        run: cargo test --test cli_model_validation -- --test-threads=4
      - name: Workspace and history tests
        run: cargo test --test e2e_workspace_history -- --test-threads=4
      - name: E2E export pages
        run: cargo test --test e2e_export_pages -- --test-threads=4
      - name: Background mode tests
        run: cargo test --test background_mode -- --test-threads=4
      - name: Stress fixture tests
        run: cargo test --test stress_fixtures -- --test-threads=4
      - name: Shell e2e preview/pages
        run: |
          cargo build
          ./scripts/e2e_preview_pages.sh ./target/debug/bvr
      - name: Upload e2e regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvr-e2e-regression-artifacts
          path: target/bvr-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  viewer:
    name: Exported Viewer Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exporter with embedded viewer assets
        run: cargo build --locked
      - name: Prepare browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/bvr-browser-tests" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/bvr-browser-tests/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: Run viewer and exported-dashboard regressions
        env:
          NODE_PATH: ${{ runner.temp }}/bvr-browser-tests/node_modules
          BVR_BIN: ${{ github.workspace }}/target/debug/bvr
          BVR_VIEWER_ARTIFACT_DIR: ${{ github.workspace }}/target/bvr-viewer-artifacts
        run: node --test scripts/test_viewer_search.cjs
      - name: Upload exported dashboard regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvr-viewer-regression-artifacts
          path: target/bvr-viewer-artifacts
          if-no-files-found: ignore
          retention-days: 7

  bench:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks (smoke)
        run: cargo bench --bench triage -- --warm-up-time 1 --measurement-time 2 --sample-size 10

  build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [unit, conformance, e2e, viewer]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bvr-linux-x86_64
          path: target/release/bvr
          retention-days: 7
